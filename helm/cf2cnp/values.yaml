# Default values for cf2cnp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/onzack/cf2cnp
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 80

containerPort: 8080

# Base URL clients reach cf2cnp at (scheme://host[:port][/prefix]), used for the download_url in JSON
# answers (the Grafana action). Leave empty to derive it from each request and the Forwarded /
# X-Forwarded-Proto / X-Forwarded-Host headers a TLS-terminating ingress or gateway sets. Set it when
# the proxy strips those headers or the public URL differs from the Host the pod sees.
externalURL: ""

# CORS (E6): origins allowed to call /generate from a browser (Grafana's origin for the dashboard action).
# Empty = any origin, the historical default.
cors:
  allowedOrigins: []
  # - https://grafana.example.com

# Authentication (E6): a bearer token required on /generate and /download (never on /health or the page).
# Prefer existingSecret (a Secret with the key `token`); `token` is for labs.
auth:
  token: ""
  existingSecret: ""

# A CiliumNetworkPolicy for the cf2cnp pod (E6): ingress from the Gateway (reserved:ingress) and from the
# endpoints listed, on the container port; egress to kube-dns only.
networkPolicy:
  enabled: false
  fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: grafana

# Extra arguments appended to `cf2cnp serve --port <containerPort>` (e.g. a flag this chart has no value for)
extraArgs: []

# Extra environment variables for the container (list of EnvVar; CF2CNP_EXTERNAL_URL is an alternative to externalURL)
extraEnv: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cf2cnp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cf2cnp-tls
  #    hosts:
  #      - cf2cnp.local

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames:
    - cf2cnp.local
  paths:
    - path: /
      pathType: PathPrefix

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Extra manifests to deploy as part of this chart
extraManifests: []
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: extra-configmap
#     data:
#       key: value

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
