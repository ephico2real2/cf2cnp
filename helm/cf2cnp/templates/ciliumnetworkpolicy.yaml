{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.dns.resolver (not .Values.networkPolicy.dnsEgress) }}
{{- fail "networkPolicy.dnsEgress must be set when dns.resolver is set: this policy would otherwise allow kube-system/kube-dns:53, not the resolver the server names (review ENH-003)" }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "cf2cnp.fullname" . }}
  labels:
    {{- include "cf2cnp.labels" . | nindent 4 }}
spec:
  description: cf2cnp — reachable from the Gateway (reserved:ingress), the kubelet's probes (reserved:host) and the listed endpoints only; egress to the cluster's DNS only
  endpointSelector:
    matchLabels:
      {{- include "cf2cnp.selectorLabels" . | nindent 6 }}
  ingress:
    # measured on Cilium 1.20.1 with Gateway API: a request through the Gateway reaches the pod as reserved:ingress;
    # the kubelet's liveness/readiness probes reach it as reserved:host — without host, the pod fails its probes
    - fromEntities: [ingress, host]
      toPorts:
        - ports:
            - port: {{ .Values.containerPort | quote }}
              protocol: TCP
    {{- with .Values.networkPolicy.fromEndpoints }}
    - fromEndpoints:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $.Values.containerPort | quote }}
              protocol: TCP
    {{- end }}
  egress:
    # the resolver the dns.profile names (Cilium's DNS guide: OpenShift's DNS operator runs in openshift-dns on 5353
    # without the k8s-app label). A custom dns.resolver names pods this rule does not know: set networkPolicy.dnsEgress.
    {{- if .Values.networkPolicy.dnsEgress }}
    {{- toYaml (list .Values.networkPolicy.dnsEgress) | nindent 4 }}
    {{- else if eq .Values.dns.profile "openshift" }}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openshift-dns
      toPorts:
        - ports:
            - port: "5353"
              protocol: ANY
    {{- else }}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    {{- end }}
{{- end }}
