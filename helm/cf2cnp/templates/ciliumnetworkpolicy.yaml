{{- if .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "cf2cnp.fullname" . }}
  labels:
    {{- include "cf2cnp.labels" . | nindent 4 }}
spec:
  description: cf2cnp — reachable from the Gateway and the listed endpoints only; egress to kube-dns only
  endpointSelector:
    matchLabels:
      {{- include "cf2cnp.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: {{ .Values.containerPort | quote }}
              protocol: TCP
    {{- with .Values.networkPolicy.fromEndpoints }}
    - fromEndpoints:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $.Values.containerPort | quote }}
              protocol: TCP
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
{{- end }}
